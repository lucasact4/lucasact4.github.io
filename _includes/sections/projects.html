<section id="projetos" class="container mt-3">
    <div class="bg-white-page executed-projects">
        <h2 class="executed-projects__title text-center">Projetos Desenvolvidos</h2>
        <div class="row justify-content-center">
            {% for project in site.data.projects %}
            <div class="col-md-4 mb-3">
                <article class="project-card">
                    {% include components/project-image.html item=project %}
                    {% include components/project-details.html item=project %}
                </article>
            </div>
            {% endfor %}
        </div>
    </div>
</section>

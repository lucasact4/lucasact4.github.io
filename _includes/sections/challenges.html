<details id="desafios" class="featured-projects__more">
    <summary>Desafios desenvolvidos</summary>
    <div class="featured-projects__grid challenge-grid">
        {% for challenge in site.data.challenges %}
        {% assign slug = challenge.title | slugify | prepend: 'desafio-' %}
        <article class="project-card challenge-card">
            {% include components/project-image.html item=challenge %}
            <h3 class="challenge-card__title">
                <button id="{{ slug }}-botao" class="challenge-card__toggle collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#{{ slug }}" aria-expanded="false" aria-controls="{{ slug }}">
                    {{ challenge.title | escape }}
                    <i class="bi bi-chevron-down" aria-hidden="true"></i>
                </button>
            </h3>
            <div id="{{ slug }}" class="collapse" aria-labelledby="{{ slug }}-botao">
                {% include components/project-details.html item=challenge %}
            </div>
        </article>
        {% endfor %}
    </div>
</details>

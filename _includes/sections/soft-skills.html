<section data-reveal class="soft-skills" aria-labelledby="soft-skills-title">
    <h2 id="soft-skills-title" class="soft-skills__title">Soft Skills</h2>
    <ul class="tech-band__list">
        {% for skill in site.data.skills.soft %}
        <li class="tech-chip">
            <i class="bi {{ skill.icon | escape }}" aria-hidden="true"></i>
            <span class="tech-chip__name">{{ skill.label | escape }}</span>
        </li>
        {% endfor %}
    </ul>
</section>

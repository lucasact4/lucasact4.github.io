<section class="container mt-3">
    <div class="bg-white-page soft-skills text-center">
        <h2 class="skills__title">Soft Skills</h2>
        <div class="row">
            <div class="col-md-12 p-3">
                {% for skill in site.data.skills.soft %}
                <button type="button" class="skill-button">
                    <i class="bi {{ skill.icon | escape }}" aria-hidden="true"></i>
                    {{ skill.label | escape }}
                </button>
                {% endfor %}
            </div>
        </div>
    </div>
</section>

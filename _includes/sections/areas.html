<section class="container mt-3">
    <div class="bg-white-page areas-atuacao">
        <h2 class="areas-atuacao__title text-center">Áreas de Atuação</h2>
        {% for row in site.data.areas %}
        <div class="row justify-content-center">
            {% for area in row %}
            <div class="col-lg-3 col-md-6 mb-3">
                <div class="card">
                    <div class="card-body text-center">
                        <h3 class="card-title">{{ area | escape }}</h3>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
        {% endfor %}
    </div>
</section>
